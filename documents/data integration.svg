<svg xmlns="http://www.w3.org/2000/svg" width="1222" height="712" viewBox="0 0 1222 712">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#111"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .small{font-size:15px}.tabletext{font-size:18px}.title{font-size:23px;font-weight:bold}
      .connector{fill:none;stroke:#111;stroke-width:1.15;marker-end:url(#arrow)}
      .tbl{stroke-width:1}
    </style>
  </defs>
  <rect width="1222" height="712" fill="#fff"/>
  <rect x="340" y="0.5" width="451" height="65" fill="#fff" stroke="#111"/>
  <text x="399" y="40" class="title">Integration Model</text><text x="589" y="39" font-size="12">(how to tables are related )</text>
  <rect x="0" y="170" width="591" height="541" rx="83" fill="none" stroke="#444" stroke-dasharray="3 3"/>
  <rect x="630" y="180" width="592" height="531" rx="82" fill="none" stroke="#444" stroke-dasharray="3 3"/>
  <rect x="180" y="140" width="231" height="61" rx="9" fill="#dce8fa" stroke="#6d91d4"/>
  <text x="250" y="185" font-size="40" font-weight="bold">CRM</text>
  <rect x="810" y="140" width="231" height="61" rx="9" fill="#fff1c9" stroke="#d7a729"/>
  <text x="885" y="185" font-size="40" font-weight="bold">ERP</text>
  <text x="318" y="260" class="small">Current &amp; history Products information</text>
  <text x="860" y="260" class="small">Product Categories</text>
  <text x="69" y="321" class="small">Transaction Record about</text><text x="103" y="340" class="small">sales &amp; orders</text>
  <text x="379" y="480" class="small">Customer_information</text>
  <text x="799" y="421" class="small">Extera Customer Information (DOB)</text>
  <text x="856" y="571" class="small">customer location</text>
  <!-- relationship arrows -->
  <path class="connector" d="M226 390 H255 V326 H374"/>
  <path class="connector" d="M215 430 H295 V568 H374"/>
  <path class="connector" d="M845 348 H685 V326 H535"/>
  <path class="connector" d="M840 511 H670 V568 H535"/>
  <path class="connector" d="M845 658 H670 V568 H535"/>
  <!-- CRM sales -->
  <g class="tbl">
    <rect x="75.5" y="350.5" width="160" height="100" rx="12" fill="#fff" stroke="#7294d2"/>
    <path d="M76 363 Q76 351 88 351 H223 Q235 351 235 363 V380 H76Z" fill="#dce8fa" stroke="#7294d2"/>
    <text x="88" y="371" class="tabletext">crm_sales_details</text>
    <line x1="76" y1="380.5" x2="235" y2="380.5" stroke="#7294d2"/>
    <text x="80" y="402" class="tabletext">sls_prd_key</text>
    <text x="80" y="441" class="tabletext">sls_cust_id</text>
    <rect x="75.5" y="450.5" width="160" height="30" fill="#f1f1f1" stroke="#888"/>
    <text x="132" y="474" class="tabletext" fill="#444">sales</text>
  </g>
  <!-- CRM product -->
  <g class="tbl">
    <rect x="375.5" y="280.5" width="160" height="60" rx="12" fill="#fff" stroke="#7294d2"/>
    <path d="M376 293 Q376 281 388 281 H523 Q535 281 535 293 V310 H376Z" fill="#dce8fa" stroke="#7294d2"/>
    <text x="402" y="301" class="tabletext">crm_prd_info</text>
    <line x1="376" y1="310.5" x2="535" y2="310.5" stroke="#7294d2"/>
    <text x="380" y="333" class="tabletext">prd_key</text>
    <rect x="375.5" y="340.5" width="160" height="30" fill="#d7e8d5" stroke="#78b95d"/>
    <text x="416" y="363" class="tabletext">Products</text>
  </g>
  <!-- CRM customer -->
  <g class="tbl">
    <rect x="375.5" y="500.5" width="160" height="90" rx="12" fill="#fff" stroke="#7294d2"/>
    <path d="M376 513 Q376 501 388 501 H523 Q535 501 535 513 V530 H376Z" fill="#dce8fa" stroke="#7294d2"/>
    <text x="398" y="521" class="tabletext">crm_cust_info</text>
    <line x1="376" y1="530.5" x2="535" y2="530.5" stroke="#7294d2"/>
    <text x="380" y="552" class="tabletext">cust_id</text><text x="380" y="582" class="tabletext">cst_key</text>
    <rect x="375.5" y="590.5" width="160" height="30" fill="#f7cece" stroke="#f05a5a"/>
    <text x="416" y="613" class="tabletext">Customer</text>
  </g>
  <!-- ERP product categories -->
  <g class="tbl">
    <rect x="845.5" y="280.5" width="160" height="60" rx="12" fill="#fff" stroke="#d7a729"/>
    <path d="M846 293 Q846 281 858 281 H993 Q1005 281 1005 293 V310 H846Z" fill="#fff1c9" stroke="#d7a729"/>
    <text x="851" y="301" class="tabletext">erp_px_cat_g1v2</text>
    <line x1="846" y1="310.5" x2="1005" y2="310.5" stroke="#d7a729"/>
    <text x="850" y="333" class="tabletext">id</text>
    <rect x="845.5" y="340.5" width="160" height="30" fill="#d7e8d5" stroke="#78b95d"/>
    <text x="886" y="363" class="tabletext">Products</text>
  </g>
  <!-- ERP customer DOB -->
  <g class="tbl">
    <rect x="840.5" y="440.5" width="160" height="64" rx="12" fill="#fff" stroke="#d7a729"/>
    <path d="M841 453 Q841 441 853 441 H988 Q1000 441 1000 453 V470 H841Z" fill="#fff1c9" stroke="#d7a729"/>
    <text x="856" y="461" class="tabletext">erp_cust_az12</text>
    <line x1="841" y1="470.5" x2="1000" y2="470.5" stroke="#d7a729"/>
    <text x="845" y="493" class="tabletext">cid</text>
    <rect x="840.5" y="504.5" width="160" height="31" fill="#f7cece" stroke="#f05a5a"/>
    <text x="880" y="528" class="tabletext">Customer</text>
  </g>
  <!-- ERP customer location -->
  <g class="tbl">
    <rect x="845.5" y="590.5" width="160" height="60" rx="12" fill="#fff" stroke="#d7a729"/>
    <path d="M846 603 Q846 591 858 591 H993 Q1005 591 1005 603 V620 H846Z" fill="#fff1c9" stroke="#d7a729"/>
    <text x="851" y="611" class="tabletext">erp_loc_a101</text>
    <line x1="846" y1="620.5" x2="1005" y2="620.5" stroke="#d7a729"/>
    <text x="850" y="643" class="tabletext">cid</text>
    <rect x="845.5" y="650.5" width="160" height="30" fill="#f7cece" stroke="#f05a5a"/>
    <text x="885" y="673" class="tabletext">Customer</text>
  </g>
</svg>
